
name: ComicHub CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ComicApi.sln

      - name: Build solution
        run: dotnet build ComicApi.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ComicApi.sln --no-build --configuration Release
